<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Диафильм</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="home">
    <h1>Диафильмы</h1>
    <p>Выберите альбом.</p>
    <div id="album-list" class="album-list"></div>
  </main>
  <script>
    fetch('./albums/index.json', {cache:'no-store'})
      .then(r => {
        if (!r.ok) throw new Error('albums/index.json не найден');
        return r.json();
      })
      .then(data => {
        const box = document.getElementById('album-list');
        if (!data.albums?.length) {
          box.textContent = 'Альбомов пока нет.';
          return;
        }
        for (const a of data.albums) {
          const el = document.createElement('a');
          el.className = 'album-card';
          el.href = `./albums/${encodeURIComponent(a.slug)}/?autoplay=1`;
          el.innerHTML = `<strong>${escapeHtml(a.title)}</strong><span>${a.count ?? ''} кадров</span>`;
          box.appendChild(el);
        }
      })
      .catch(err => {
        document.getElementById('album-list').textContent = err.message;
      });

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
      }[c]));
    }
  </script>
</body>
</html>
